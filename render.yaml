# Render blueprint: New > Blueprint > point at this repo. Builds the Dockerfile and provisions Postgres.
# Note: Render's free Postgres expires after 30 days; use a paid plan (or Neon/Supabase + PG_SSL=true) for longer.
services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    healthCheckPath: /health?probe=live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seat-reservation-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: seat-reservation-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PG_POOL_MAX
        value: "40"
      - key: LOG_LEVEL
        value: info
      - key: SHOW_STATE_CACHE_MS
        value: "250"
      # Logs are pushed to the monitoring service below. Set LOKI_URL after the first deploy, to
      # https://<seat-monitoring host>/loki/api/v1/push ; until then the app simply does not push.
      - key: LOKI_URL
        sync: false
      - key: LOKI_TOKEN
        fromService:
          type: web
          name: seat-monitoring
          envVarKey: LOKI_TOKEN

  # Grafana + Prometheus + Loki in one container (see observability/render). Grafana is the public face; log pushes need the token.
  # Free web services sleep when idle and have no disk, so history is short and charts have gaps while it is asleep.
  - type: web
    name: seat-monitoring
    runtime: docker
    plan: free
    dockerfilePath: ./observability/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: GF_SECURITY_ADMIN_PASSWORD
        generateValue: true
      - key: LOKI_TOKEN
        generateValue: true
      # Host of the app to scrape, without https://, for example seat-reservation-7wrl.onrender.com
      - key: APP_HOST
        sync: false

  # Redis-compatible store for seat leases. Losing it is safe: Postgres still decides every reservation.
  - type: keyvalue
    name: seat-reservation-cache
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: seat-reservation-db
    plan: free
    databaseName: seats
    user: seats
