# Render blueprint: New > Blueprint > point at this repo. Builds the Dockerfile and provisions Postgres.
# Note: Render's free Postgres expires after 30 days; use a paid plan (or Neon/Supabase + PG_SSL=true) for longer.
services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seat-reservation-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: seat-reservation-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PG_POOL_MAX
        value: "20"
      - key: LOG_LEVEL
        value: info

  # Redis-compatible store for seat leases. Losing it is safe: Postgres still decides every reservation.
  - type: keyvalue
    name: seat-reservation-cache
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: seat-reservation-db
    plan: free
    databaseName: seats
    user: seats
