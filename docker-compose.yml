services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seats
      POSTGRES_PASSWORD: seats
      POSTGRES_DB: seats
    ports:
      - "5433:5432"
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seats -d seats"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://seats:seats@postgres:5432/seats
      JWT_SECRET: dev-jwt-secret-change-me
      ADMIN_TOKEN: dev-admin-token
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
